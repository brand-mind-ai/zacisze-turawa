media:
  input: public/media
  output: /media

content:
  - name: pl_pages
    label: Polish pages
    type: collection
    path: src/content/pl/pages
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: canonicalPath
        label: Canonical path
        type: string
        required: true
      - name: sourceUrl
        label: Source URL
        type: string
      - name: heroImage
        label: Hero image
        type: image
      - name: body
        label: Body
        type: rich-text

  - name: pl_rooms
    label: Polish rooms
    type: collection
    path: src/content/pl/rooms
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: canonicalPath
        label: Canonical path
        type: string
        required: true
      - name: sourceUrl
        label: Source URL
        type: string
      - name: heroImage
        label: Hero image
        type: image
      - name: gallery
        label: Gallery
        type: image
        list: true
      - name: body
        label: Body
        type: rich-text

  - name: pl_offers
    label: Polish offers and packages
    type: collection
    path: src/content/pl/offers
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: canonicalPath
        label: Canonical path
        type: string
        required: true
      - name: sourceUrl
        label: Source URL
        type: string
      - name: heroImage
        label: Hero image
        type: image
      - name: gallery
        label: Gallery
        type: image
        list: true
      - name: body
        label: Body
        type: rich-text

  - name: en_pages
    label: English pages
    type: collection
    path: src/content/en/pages
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: canonicalPath
        label: Canonical path
        type: string
        required: true
      - name: sourceUrl
        label: Source URL
        type: string
      - name: heroImage
        label: Hero image
        type: image
      - name: gallery
        label: Gallery
        type: image
        list: true
      - name: body
        label: Body
        type: rich-text

  - name: de_pages
    label: German pages
    type: collection
    path: src/content/de/pages
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: canonicalPath
        label: Canonical path
        type: string
        required: true
      - name: sourceUrl
        label: Source URL
        type: string
      - name: heroImage
        label: Hero image
        type: image
      - name: gallery
        label: Gallery
        type: image
        list: true
      - name: body
        label: Body
        type: rich-text

  - name: site_data
    label: Site data
    type: file
    path: src/data/domains.json
    format: json
    fields:
      - name: temporaryLaunchDomain
        label: Temporary launch domain
        type: string
      - name: finalCanonicalDomain
        label: Final canonical domain
        type: string
      - name: seoPolicy
        label: SEO policy
        type: text

  - name: site_content
    label: Site content
    type: file
    path: src/data/site-content.json
    format: json
    fields:
      - name: brandName
        label: Brand name
        type: string
      - name: location
        label: Location
        type: string
      - name: heroTitle
        label: Hero title
        type: string
      - name: heroDeck
        label: Hero deck
        type: text
      - name: heroFacts
        label: Hero facts
        type: object
        list: true
        fields:
          - name: value
            label: Value
            type: string
          - name: label
            label: Label
            type: string
      - name: homeSections
        label: Homepage sections
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
          - name: href
            label: URL
            type: string
          - name: text
            label: Text
            type: text
          - name: image
            label: Image
            type: image
      - name: galleryTitle
        label: Gallery title
        type: string
      - name: roomsTitle
        label: Rooms title
        type: string
      - name: offersTitle
        label: Offers title
        type: string
