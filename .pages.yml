media:
  input: public/media
  output: /media

content:
  - name: pl_pages
    label: Polish pages
    type: collection
    path: src/content/pl/pages
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: canonicalPath
        label: Canonical path
        type: string
        required: true
      - name: sourceUrl
        label: Source URL
        type: string
      - name: heroImage
        label: Hero image
        type: image
      - name: body
        label: Body
        type: rich-text

  - name: pl_rooms
    label: Polish rooms
    type: collection
    path: src/content/pl/rooms
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: canonicalPath
        label: Canonical path
        type: string
        required: true
      - name: sourceUrl
        label: Source URL
        type: string
      - name: heroImage
        label: Hero image
        type: image
      - name: gallery
        label: Gallery
        type: image
        list: true
      - name: body
        label: Body
        type: rich-text

  - name: pl_offers
